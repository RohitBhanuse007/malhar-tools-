<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malhar Tools | Hardware • Tools • Spares</title>
    <!-- Google Fonts for English and Marathi typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-faint-50 text-slate-900 antialiased font-sans selection:bg-brand-400 selection:text-slate-950">
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;background:radial-gradient(circle at center, #1c1917 0%, #09090b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;color:white;font-family:system-ui,-apple-system,sans-serif;">
        <div style="position:relative;padding:14px;border-radius:24px;background:#000;border:2px solid rgba(245,158,11,0.5);box-shadow:0 0 35px rgba(245,158,11,0.35);animation:pulseLogo 2.4s infinite ease-in-out;">
          <img src="/logo.png" alt="Malhar Tools" style="width:115px;height:115px;object-fit:contain;display:block;" />
        </div>
        <div style="margin-top:24px;text-align:center;">
          <h1 style="font-size:28px;font-weight:900;letter-spacing:-0.5px;margin:0;">
            <span style="color:#fbbf24;text-shadow:0 0 15px rgba(251,191,36,0.4);">MALHAR </span>
            <span style="color:#ffffff;">TOOLS</span>
          </h1>
          <p style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(253,230,138,0.9);margin-top:8px;font-weight:600;">
            HARDWARE • TOOLS • SPARES
          </p>
          <p style="font-size:11px;color:rgba(251,191,36,0.8);margin-top:4px;font-weight:500;">
            हार्डवेअर • टूल्स • स्पेअर्स
          </p>
        </div>
        <div style="margin-top:24px;width:190px;height:5px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;position:relative;border:1px solid rgba(245,158,11,0.25);">
          <div style="width:60%;height:100%;background:linear-gradient(90deg, transparent, #fbbf24, transparent);position:absolute;border-radius:99px;animation:initBar 1.5s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(245,158,11,0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(245,158,11,0.6); }
          }
          @keyframes initBar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
